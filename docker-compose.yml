services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  runtime-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    command: python -m workers.runtime_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  telegram-poller:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    command: python -m workers.telegram_poller
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev.frontend
    env_file:
      - backend/.env
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  web-client-stub:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./examples/web_client_stub:/app
    env_file:
      - examples/web_client_stub/.env
    command: >
      sh -c "pip install -q -r requirements.txt &&
      uvicorn main:app --host 0.0.0.0 --port 8765"
    ports:
      - "8765:8765"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  postgres_data:
