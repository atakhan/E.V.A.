services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    environment:
      PORT: 8000
    volumes:
      - ./backend/app:/app/app
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev.frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
