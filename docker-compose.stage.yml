# Stage: сеть tetrakomnet-stage, edge — nginx_proxy (eva-stage.tetrakom-crm-miniapp.ru).
# Секреты — Infisical (папки /eva-postgres, /eva-redis, /eva-backend, env=staging).
# Запуск: make start-stage

name: eva-stage

x-backend-environment: &backend-environment
  PORT: ${PORT}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  EVA_EVENT_STREAM: ${EVA_EVENT_STREAM}
  EVA_EVENT_CONSUMER_GROUP: ${EVA_EVENT_CONSUMER_GROUP}
  EVA_AUTO_MIGRATE: ${EVA_AUTO_MIGRATE}
  EVA_CREDENTIALS_KEY: ${EVA_CREDENTIALS_KEY}
  EVA_WEBHOOK_BASE: ${EVA_WEBHOOK_BASE}
  EVA_TELEGRAM_MODE: ${EVA_TELEGRAM_MODE}
  EVA_TELEGRAM_POLLING: ${EVA_TELEGRAM_POLLING}
  EVA_POLZA_MODE: ${EVA_POLZA_MODE}
  POLZA_API_BASE: ${POLZA_API_BASE}
  POLZA_DEFAULT_MODEL: ${POLZA_DEFAULT_MODEL}
  EVA_DEFAULT_SKILL_IDS: ${EVA_DEFAULT_SKILL_IDS}
  EVA_PUBLIC_URL: ${EVA_PUBLIC_URL}
  EVA_WEB_CLIENT_DOCKER_HOST: ${EVA_WEB_CLIENT_DOCKER_HOST}
  EVA_WEB_CLIENT_DOCKER_REWRITE: ${EVA_WEB_CLIENT_DOCKER_REWRITE}
  EVA_TOOL_INPUT_VALIDATION: ${EVA_TOOL_INPUT_VALIDATION}
  EVA_EVENT_MAX_ATTEMPTS: ${EVA_EVENT_MAX_ATTEMPTS}
  EVA_PRUNE_EPHEMERAL_AGENTS: ${EVA_PRUNE_EPHEMERAL_AGENTS}

services:
  eva-postgres-stage:
    container_name: eva-postgres-stage
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - eva_postgres_data_stage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

  eva-redis-stage:
    container_name: eva-redis-stage
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - eva_redis_data_stage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

  eva-backend-stage:
    container_name: eva-backend-stage
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tetrakom-eva-backend:stage
    environment:
      <<: *backend-environment
    expose:
      - "8000"
    depends_on:
      eva-postgres-stage:
        condition: service_healthy
      eva-redis-stage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

  eva-runtime-worker-stage:
    container_name: eva-runtime-worker-stage
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tetrakom-eva-backend:stage
    command: python -m workers.runtime_worker
    environment:
      <<: *backend-environment
    depends_on:
      eva-postgres-stage:
        condition: service_healthy
      eva-redis-stage:
        condition: service_healthy
      eva-backend-stage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

  eva-telegram-poller-stage:
    container_name: eva-telegram-poller-stage
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tetrakom-eva-backend:stage
    command: python -m workers.telegram_poller
    environment:
      <<: *backend-environment
    depends_on:
      eva-postgres-stage:
        condition: service_healthy
      eva-redis-stage:
        condition: service_healthy
      eva-backend-stage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

  eva-frontend-stage:
    container_name: eva-frontend-stage
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tetrakom-eva-frontend:stage
    expose:
      - "8080"
    depends_on:
      eva-backend-stage:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tetrakomnet-stage

volumes:
  eva_postgres_data_stage:
  eva_redis_data_stage:

networks:
  tetrakomnet-stage:
    external: true
